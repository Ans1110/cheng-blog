name: Deploy

# Push to main -> checks -> build images to GHCR -> schema + restart on the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cheng-blog

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase.
      - name: Image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Schema image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}-migrate:${{ github.sha }}
            ${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: pizza-cheng
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Copy compose stack
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.yml,deploy/Caddyfile
          target: /opt/cheng-blog
          strip_components: 1

      - name: Apply schema and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/cheng-blog
            export IMAGE IMAGE_TAG

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose --profile migrate pull app migrate
            docker logout ghcr.io

            docker compose up -d mysql
            # drizzle-kit push asks before destructive changes; the timeout turns
            # a waiting prompt into a failed deploy instead of a hung one. The old
            # app keeps serving until this step succeeds.
            timeout 300 docker compose --profile migrate run --rm migrate

            docker compose up -d app caddy

            # Wait for the new app to answer before calling it done.
            for i in $(seq 1 30); do
              if docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                echo "Healthy: $IMAGE:$IMAGE_TAG"
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "App did not become healthy" >&2
            docker compose logs --tail 80 app >&2
            exit 1
